<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17251d;--mute:#5d6b63;--line:#d9e0da;--brand:#1d5b3a;--brand-ink:#fff;--chip:#e8f0ea;--chip-h:#d3e5d8;--cust:#b3261e;--cust-bg:#fbeceb;--cust-h:#f5d4d1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#17231c;--ink:#e6efe9;--mute:#98a89e;--line:#2a3a31;--brand:#164a2f;--chip:#22352a;--chip-h:#2d4637;--cust:#ff9a92;--cust-bg:#3a1f1d;--cust-h:#4d2927}}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Myanmar","Myanmar Text","Padauk",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:.75rem 1rem;position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem}
header img{height:44px;width:auto;border-radius:4px;display:block}
.tools{display:flex;gap:.5rem;align-items:center}
.grow{flex:1;min-width:200px}
#q{width:100%;padding:.55rem .8rem;border:0;border-radius:8px;font:inherit;background:#fff;color:#17251d}
main{max-width:1100px;margin:0 auto;padding:1rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem 1rem;margin-bottom:.9rem}
section.cust{border-color:var(--cust)}
h2{margin:0 0 .6rem;font-size:1.05rem;font-weight:600}
section.cust h2{color:var(--cust)}
.links{display:flex;flex-wrap:wrap;gap:.45rem}
.links a{display:inline-block;padding:.4rem .75rem;border-radius:8px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:.95rem}
.links a:hover{background:var(--chip-h)}
section.cust .links a{background:var(--cust-bg);color:var(--cust)}
section.cust .links a:hover{background:var(--cust-h)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.copy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem}
.copy-item label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:.2rem}
.copy-row{display:flex;gap:.35rem}
.copy-row input{flex:1;min-width:0;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:.85rem ui-monospace,Consolas,monospace}
.copy-row button{padding:.4rem .8rem;border:0;border-radius:6px;background:var(--brand);color:#fff;font:inherit;font-size:.9rem;cursor:pointer;min-width:4.6rem}
.copy-row button.done{background:#2e7d32}
#empty{display:none;text-align:center;color:var(--mute);padding:2rem 0}
@media(max-width:520px){main{padding:.6rem}header img{height:38px}}
</style>
</head>

];

function el(tag,attrs,text){var e=document.createElement(tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;return e}

var wrap=document.getElementById("sections");
SECTIONS.forEach(function(s){
  var sec=el("section",s.c?{"class":"cust"}:{});
  sec.appendChild(el("h2",{},s.t));
  var box=el("div",{"class":"links"});
  s.l.forEach(function(i){
    var ext=/^https?:/.test(i[1]);
    var a=el("a",{href:i[1]},i[0]);
    if(ext||i[2]){a.target="_blank";a.rel="noopener"}
    box.appendChild(a);
  });
  sec.appendChild(box);wrap.appendChild(sec);
});

var grid=document.getElementById("copy-grid");
COPY.forEach(function(c,n){
  var item=el("div",{"class":"copy-item"});
  var id="c"+n;
  item.appendChild(el("label",{"for":id},c[0]));
  var row=el("div",{"class":"copy-row"});
  var inp=el("input",{type:"text",id:id,readonly:"readonly",value:c[1]});
  var btn=el("button",{type:"button"},"Copy");
  btn.onclick=function(){
    function ok(){btn.textContent="Copied";btn.className="done";setTimeout(function(){btn.textContent="Copy";btn.className=""},1500)}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(c[1]).then(ok,fallback)}else fallback();
    function fallback(){inp.select();inp.setSelectionRange(0,99999);try{document.execCommand("copy");ok()}catch(e){}}
  };
  row.appendChild(inp);row.appendChild(btn);item.appendChild(row);grid.appendChild(item);
});

document.getElementById("q").addEventListener("input",function(){
  var q=this.value.trim().toLowerCase(),shown=0;
  document.querySelectorAll("#sections section").forEach(function(sec){
    var titleHit=sec.querySelector("h2").textContent.toLowerCase().indexOf(q)>-1,any=false;
    sec.querySelectorAll(".links a").forEach(function(a){
      var hit=!q||titleHit||a.textContent.toLowerCase().indexOf(q)>-1;
      a.style.display=hit?"":"none";if(hit)any=true;
    });
    sec.style.display=any?"":"none";if(any)shown++;
  });
  var cs=document.getElementById("copy-sec"),cany=false;
  document.querySelectorAll(".copy-item").forEach(function(it){
    var hit=!q||it.querySelector("label").textContent.toLowerCase().indexOf(q)>-1;
    it.style.display=hit?"":"none";if(hit)cany=true;
  });
  cs.style.display=cany?"":"none";
  document.getElementById("empty").style.display=(shown||cany)?"none":"block";
});
